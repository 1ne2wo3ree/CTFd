{% extends "base.html" %}

{% block content %}
  {% if request.path == '/' %}
    {{ content | safe }}
  {% else %}
    <div class="container-fluid px-0 mt-4" style="position: relative; z-index: 10;">
      <div class="pafms-card p-4 rounded-4">
        {{ content | safe }}
      </div>
    </div>
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/page.js") }}
{% endblock %}
